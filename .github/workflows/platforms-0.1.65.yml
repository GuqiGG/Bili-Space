name: Validate native Windows, macOS and Linux clients
on:
  push:
    branches: [codex/navigation-accounts-platforms]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified 0.1.65 release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: platforms-0.1.65-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {filter: 'blob:none'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install icon build dependency
        run: python3 -m pip install Pillow==12.0.0
      - name: Build universal native app
        run: |
          cmake -S . -B build/macos -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
          cmake --build build/macos --config Release -j 3
          codesign --force --deep --sign - build/macos/Bili-Space.app
          build/macos/Bili-Space.app/Contents/MacOS/Bili-Space --self-test
          mkdir -p releases
          ditto -c -k --sequesterRsrc --keepParent build/macos/Bili-Space.app releases/Bili-Space-0.1.65-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: releases/Bili-Space-0.1.65-macos-universal.zip
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {filter: 'blob:none'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Build APK
        shell: pwsh
        run: |
          "sdk.dir=$env:ANDROID_HOME" | Set-Content android/local.properties
          ./scripts/build_android.ps1
          New-Item -ItemType Directory -Force releases | Out-Null
          Move-Item dist/Bili-Space-0.1.65-android.apk releases/
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: releases/Bili-Space-0.1.65-android.apk
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {filter: 'blob:none'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install native system WebKit
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install -y --no-install-recommends python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 gstreamer1.0-libav gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly xvfb dbus-x11
      - name: Package and launch GTK app
        run: |
          python3 scripts/test_web_cache.py
          python3 scripts/test_linux51_policy.py
          python3 scripts/package_linux.py
          BILI_SPACE_RESOURCES="$PWD/build/linux-package/usr/lib/bili-space" WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 xvfb-run -a dbus-run-session -- /usr/bin/python3 src/linux_main.py --self-test
          dpkg-deb --contents releases/Bili-Space-0.1.65-linux.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: releases/Bili-Space-0.1.65-linux.deb
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env: {PYTHONUTF8: '1'}
    steps:
      - uses: actions/checkout@v4
        with: {filter: 'blob:none'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install icon build dependency
        run: python -m pip install Pillow==12.0.0
      - name: Verify shared UI and build native host
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { throw 'npm ci failed' }
          node --test --test-force-exit tests/*.test.cjs
          if ($LASTEXITCODE) { throw 'UI regression failed' }
          New-Item -ItemType Directory -Force .tools,verification | Out-Null
          ./scripts/build.ps1
          if ($LASTEXITCODE) { throw 'Windows build failed' }
          ./scripts/test_accounts50_native.ps1
          if ($LASTEXITCODE) { throw 'Encrypted account tests failed' }
          python scripts/package.py
          if ($LASTEXITCODE) { throw 'ZIP failed' }
          python scripts/build_installer.py
          if ($LASTEXITCODE) { throw 'Installer failed' }
          ./scripts/build_win7.ps1
          if ($LASTEXITCODE) { throw 'Windows 7 compatibility build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-compatibility
          path: |
            releases/Bili-Space-0.1.65-win7-x64.zip
            releases/Bili-Space-0.1.65-win64.zip
            releases/Bili-Space-0.1.65-Setup.exe
  publish:
    if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release-0.1.65]'))
    needs: [windows, macos, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: releases
          merge-multiple: true
      - name: Publish verified platform packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish_current_release.py
