<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 sans-serif;background:#161618}.bili-header__banner{height:140px;background:linear-gradient(120deg,#214a36,#759d49,#245549);position:relative}.inner-logo{color:white;position:absolute;left:30px;bottom:20px;font-size:30px}.bili-feed4-layout{margin:0 36px}.feed2{padding-top:22px}.recommended-container_floor-aside{display:grid;grid-template-columns:3fr 1fr;gap:20px}.container{display:grid;grid-template-columns:repeat(3,1fr);grid-template-areas:"ad ad a" "ad ad b";gap:55px 20px}.recommended-swipe{grid-area:ad;height:430px;background:#ddd}.feed-card{min-width:0}.feed-card:nth-child(2){grid-area:a}.feed-card:nth-child(3){grid-area:b}.floor-aside{padding-top:270px;display:grid;gap:50px}.floor-single-card{grid-column:4;grid-row:span 2;width:300px}.feed-card .bili-video-card{width:100%}.cover{aspect-ratio:16/9;display:grid;place-items:center;background:#35504d;border-radius:9px;color:white;font:24px Consolas}.title{margin:8px 0 4px;color:#eee}.info{font-size:12px;color:#aaa}.feed-list{display:grid;grid-template-columns:repeat(4,1fr);gap:55px 20px;margin-top:55px}.load-more-anchor{height:1px}.channel-container{height:60px}
</style></head><body><header id="biliMainHeader"><div class="bili-header"><div class="bili-header__bar">网页重复导航</div><div class="bili-header__banner"><a class="inner-logo">bilibili</a></div><div class="channel-container">原频道栏</div></div></header><main class="bili-feed4-layout"><div class="feed2"><div class="recommended-container_floor-aside"><div class="container"><div class="feed-card"><div class="recommended-swipe">广告轮播</div></div></div><div class="floor-aside"></div></div><div class="feed-list"></div><div class="load-more-anchor"></div></div></main><script>
function card(i,ad=false){return `<article class="feed-card${ad?' fixture-ad':''}" data-fixture-card="${i}"><div class="bili-video-card"><a href="https://www.bilibili.com/video/BVfixture${i}"><div class="cover">VIDEO / ${i}</div><h3 class="title">${ad?'推广卡片':'正常视频 · 保留原生点击'}</h3></a><p class="info">空间观察员 · 2小时前</p>${ad?'<span data-ad-label>广告</span>':''}</div></article>`}
document.querySelector('.container').insertAdjacentHTML('beforeend',Array.from({length:8},(_,i)=>card(i)).join('')+card(90,true)+card(91,true));
document.querySelector('.floor-aside').innerHTML=[1,2].map(i=>`<article class="floor-single-card" data-fixture-card="live-${i}"><div class="cover" style="background:#514055">LIVE / ${i}</div><h3 class="title">普通直播 · 不应误删</h3><p class="info">正在直播</p></article>`).join('');
document.querySelector('.feed-list').innerHTML=Array.from({length:8},(_,i)=>card(i+8)).join('');
</script></body></html>
