<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.6 sans-serif;background:#161618}.bili-header__banner{height:120px;position:relative;overflow:hidden;background:#2b6047}.animated-banner{position:absolute;inset:0;overflow:hidden}.animated-banner>.layer{position:absolute;inset:-10px;background:repeating-linear-gradient(115deg,#24593d 0 65px,#517b3e 65px 120px);transition:transform 100ms linear}.inner-logo{position:absolute;left:28px;top:30px;font-size:30px;color:white}.bili-feed4-layout{margin:0 34px}.feed2{position:relative}.container{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}.recommended-swipe{height:330px;overflow:hidden;grid-column:span 2;grid-row:span 2}.promotion-creative{width:1600px;height:500px;background:#04404a;font-size:90px;color:white}.feed-card{min-width:0}.cover{aspect-ratio:16/9;border-radius:8px;background:#36514b;display:grid;place-items:center;color:#c3dfd5;font:25px Consolas}.feed-card h3{color:#eee;font-size:15px;font-weight:400;margin:8px 0}.feed-card p{font-size:12px;color:#aaa;margin:0 0 8px}.load-more-anchor{height:1px}.message-bgc{position:fixed;inset:0;background:#d6ebea;z-index:-1}.message-bg{position:fixed;inset:0;background-image:linear-gradient(#d6ebea,#fff);z-index:-1}.message-layout{display:flex;max-width:1200px;margin:70px auto 0;height:600px}.message-aside{background:rgba(var(--bg1_rgb,255,255,255),.8);width:175px;padding:24px}.message-main{background:rgba(var(--bg1_rgb,255,255,255),.5);flex:1;padding:12px}.message-header{padding:12px;background:var(--bg1,#fff);color:var(--text1,#222)}.session{display:grid;grid-template-columns:230px 1fr;height:500px;background:var(--bg2,#fff);color:var(--text1,#222);margin-top:12px}.contacts{padding:20px;border-right:1px solid var(--line_regular,#ddd)}.thread{padding:28px}.message-aside a{display:block;margin-bottom:24px;color:var(--text2,#999)}
</style></head><body><div id="case-home"><header id="biliMainHeader"><div class="bili-header"><div class="bili-header__bar">原网页导航</div><div class="bili-header__banner"><div class="animated-banner"><div class="layer"></div></div><span class="inner-logo">bilibili</span></div></div></header><main class="bili-feed4-layout"><div class="feed2"><div class="recommended-container_floor-aside"><div class="container"><div class="recommended-swipe"><div class="bili-video-card"><div class="promotion-creative">运营推广样本</div></div></div></div></div><div class="load-more-anchor"></div></div></main></div><div id="case-messages" hidden><div class="message-bgc"></div><div class="message-bg"></div><div class="message-layout"><aside class="message-aside"><a>消息中心</a><a>我的消息</a><a>回复我的</a><a>@我的</a><a>系统通知</a></aside><main class="message-main"><div class="message-header">我的消息</div><div class="session"><div class="contacts">最近消息<br><br>测试联系人（非真实账号）</div><div class="thread"><h2>消息深色适配</h2><p>只检查界面，不读取或发送真实聊天。</p></div></div></main></div></div><script>
const message=location.hostname==='message.bilibili.com';document.querySelector('#case-home').hidden=message;document.querySelector('#case-messages').hidden=!message;
window.__requests=[];window.__page=0;window.__motionEvents=0;
const container=document.querySelector('.container');
function appendCards(start,count){for(let i=start;i<start+count;i++){const e=document.createElement('article');e.className='feed-card';e.dataset.normal='true';e.innerHTML=`<div class="bili-video-card"><a href="https://www.bilibili.com/video/BVfixture${i}"><div class="cover">VIDEO / ${i}</div></a><h3>正常推荐视频 ${i}</h3><p>保留原生点击与信息流顺序</p></div>`;container.append(e)}}appendCards(0,16);
document.querySelector('.bili-header__banner').addEventListener('pointermove',e=>{__motionEvents++;const r=e.currentTarget.getBoundingClientRect();document.querySelector('.animated-banner .layer').style.transform=`translateX(${(e.clientX-r.x-r.width/2)*.03}px)`;});
if(!message){let loading=false;const observer=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)&&!loading&&__page<3){loading=true;__requests.push({scrollY,time:performance.now()});setTimeout(()=>{appendCards(16+__page*8,8);__page++;loading=false;},180);}});observer.observe(document.querySelector('.load-more-anchor'));}
</script></body></html>
