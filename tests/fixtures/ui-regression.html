<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>UI 回归样本 · 非真实账号</title><style>
*{box-sizing:border-box}body{margin:0;min-width:1200px;background:white;color:#222;font:14px/1.6 sans-serif}#biliMainHeader,#bili-header-container{height:64px}.case{display:none}.case.visible{display:block}.label{color:#92929e;font-size:11px;letter-spacing:1px;margin-bottom:16px}.content{margin:0 32px}.history-record{padding-top:86px}.bili-dyn-home--member{margin-top:64px;padding-top:80px}.bili-dyn-list__item{padding:24px;background:white;border:1px solid #eee;border-radius:9px;margin-bottom:15px}.channel-container{display:flex;gap:12px;padding:24px 0}.channel-link,.vui_button{background:#fff;color:#ddd;border:1px solid #eee;padding:8px 20px;border-radius:6px}.recommended-container_floor-aside>.container{display:grid;min-width:1200px;grid-template-columns:repeat(4,1fr);gap:60px 22px}.recommended-swipe{grid-column:span 2;grid-row:span 2;background:#ccc}.feed-card{min-width:0}.feed-card:nth-child(5){grid-column:4;grid-row:1}.feed-card:nth-child(6){grid-column:4;grid-row:2}.cover{aspect-ratio:16/9;border-radius:10px;display:grid;place-items:center;background:#344c49;color:#d1e2dd;font:24px Consolas}.feed-card h3{font-size:14px;font-weight:normal;margin:9px 0 3px}.feed-card p{font-size:11px;color:#9696a2;margin:0}.search-input{padding:20px;border:1px solid #ddd;margin:80px 100px 25px;background:#fff}.search-tabs{padding:18px 0;border-bottom:1px solid #333}.search-all-list{padding:35px 0}.search-content{background:#fff}.history-title{font-size:26px;margin:0 0 22px}.history-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.video-container-v1{padding-top:75px;max-width:900px;margin:60px auto 0}#bilibili-player{box-shadow:0 0 12px 4px #fff;background:white}.bpx-player-video-wrap{height:380px;background:#102d2d;display:grid;place-items:center;color:#bfd8d2;font:28px Consolas}.bpx-player-sending-bar{padding:12px;background:#f1f2f3;color:#222}.bpx-player-dm-input{border:0;padding:10px;width:75%;background:#fff}button{cursor:pointer}.filters{display:flex;justify-content:space-between;padding:16px 0}
</style></head><body><header id="biliMainHeader"></header><div id="app" class="content"><div class="label">REGRESSION FIXTURE / 非真实推荐与账号 · 检查布局、颜色和交互</div><section class="case" data-case="home"><div class="bili-feed4-layout"><div class="bili-header__channel"><div class="channel-container"><a class="channel-link">番剧</a><a class="channel-link">动画</a><a class="channel-link">科技数码</a></div></div><div class="recommended-container_floor-aside"><div class="container"><div class="recommended-swipe">推广轮播</div></div></div></div></section><section class="case" data-case="history"><main class="history-record"><h1 class="history-title">历史记录</h1><div class="filters"><span>综合　 视频　 直播</span><button class="vui_button">批量管理</button></div><div class="history-cards"></div></main></section><section class="case" data-case="dynamic"><main class="bili-dyn-home--member"><h1 class="history-title">动态</h1><article class="bili-dyn-list__item">动态内容从这里开始，不应在顶部留出大块空白。</article><article class="bili-dyn-list__item">保留正常内容，保持深色表面清晰可读。</article></main></section><section class="case" data-case="search"><div class="search-layout"><div class="search-header"><div class="search-input"><input value="苏丹"><button>搜索</button></div><div class="search-tabs">综合　 视频　 番剧　 直播　 用户</div></div><div class="search-content"><div class="filters"><span>综合排序　最多播放　最新发布</span><button class="vui_button">更多筛选</button></div><div class="search-all-list history-cards"></div></div></div></section><section class="case" data-case="video"><div class="video-container-v1"><div id="bilibili-player"><div class="bpx-player-container"><div class="bpx-player-video-wrap">No white glow. Just video.</div><div class="bpx-player-sending-bar">1 人正在看　<input class="bpx-player-dm-input" placeholder="发送弹幕"></div></div></div></div></section></div><script>
const path=location.pathname;const kind=location.hostname==='t.bilibili.com'?'dynamic':location.hostname==='search.bilibili.com'?'search':path.includes('history')?'history':path.includes('/video/')?'video':'home';document.querySelector(`[data-case="${kind}"]`).classList.add('visible');
function card(n){return `<article class="feed-card"><div class="cover" style="background:${['#344c49','#454154','#594637','#3d4a5a'][n%4]}">FRAME / 0${n+1}</div><h3>正常推荐视频 ${n+1} · 不应出现空置列</h3><p>空间观察员 · 2小时前</p></article>`}document.querySelector('.container').insertAdjacentHTML('beforeend',Array.from({length:8},(_,i)=>card(i)).join(''));document.querySelectorAll('.history-cards').forEach(el=>el.innerHTML=[0,1,2].map(card).join(''));
</script></body></html>
