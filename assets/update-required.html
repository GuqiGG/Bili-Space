<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bili-Space · 必须更新</title><style>
:root{color-scheme:dark;font:16px 'Segoe UI','Microsoft YaHei',sans-serif;background:#161618;color:#eeeef0}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px}main{max-width:620px;width:100%;padding:38px;border:1px solid #36363b;border-radius:24px;background:#202023}svg{width:48px;color:#fb7299}h1{font-size:28px;letter-spacing:-1px;margin:20px 0 10px}p{line-height:1.8;color:#b4b4be}ul{padding-left:22px;line-height:1.9;overflow-wrap:anywhere;max-height:35vh;overflow:auto}.actions{display:flex;gap:12px;flex-wrap:wrap}button{font:inherit;border:1px solid #494950;background:transparent;color:inherit;border-radius:10px;padding:10px 15px;cursor:pointer}button:first-child{background:#fb7299;color:#fff;border-color:#fb7299}button:disabled{opacity:.5;cursor:wait}button:focus-visible{outline:2px solid #fff;outline-offset:3px}small{display:block;color:#92929e;margin-top:24px}
</style><main><svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="m10 3 6 5 6-5" fill="none" stroke="currentColor" stroke-width="3"/><rect x="3" y="8" width="26" height="21" rx="6"/><path d="M10 16v5m12-5v5" stroke="white" stroke-width="3"/></svg><h1>更新后，继续你的 Space。</h1><p id="message" role="status" aria-live="polite"></p><strong id="version"></strong><ul id="notes"></ul><div class="actions"><button data-action="download">下载更新</button><button data-action="check">重新检查</button><button data-action="install" hidden>安装并重启</button><button data-action="exit">退出客户端</button></div><small>此版本已停止支持，不能忽略。下载校验完成后，点击安装并重启。不会删除你的登录和设置。</small></main><script>
const send=action=>chrome.webview.postMessage({type:'updates',action});document.querySelectorAll('button').forEach(b=>b.onclick=()=>send(b.dataset.action));window.renderUpdate=s=>{document.querySelector('#message').textContent=s.message||'';document.querySelector('#version').textContent='Bili-Space '+(s.version||'');const list=document.querySelector('#notes');list.replaceChildren(...(s.changelog||[]).map(t=>{const li=document.createElement('li');li.textContent=t;return li;}));document.querySelector('[data-action=install]').hidden=!s.ready;document.querySelectorAll('[data-action=download],[data-action=check],[data-action=install]').forEach(b=>b.disabled=!!s.busy);};
</script></html>
